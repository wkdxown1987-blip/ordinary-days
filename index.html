<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ordinary Days — 평범한 날들의 기록"><title>Ordinary Days — Personal Journal</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c0c12;color:#f5f3fa;font:16px/1.7 system-ui,-apple-system,'Malgun Gothic',sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}header{max-width:1100px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292733}.logo{font-weight:850;letter-spacing:.05em;font-size:19px}.accent{color:#aa87ff}nav{display:flex;gap:25px}nav a{cursor:pointer}nav a:hover,.link{color:#b69aff}main{max-width:1100px;margin:auto;padding:0 24px;min-height:70vh}.hero{padding:105px 0 95px;background:radial-gradient(ellipse at 95% 45%,#33204b77,transparent 48%)}.eyebrow{font-size:12px;color:#ac8aff;letter-spacing:3px;font-weight:750;text-transform:uppercase}h1{font-size:clamp(42px,6.4vw,78px);line-height:1.17;letter-spacing:-.045em;margin:18px 0}h2{font-size:27px}.muted{color:#aaa6b8}.btn{display:inline-block;border:0;border-radius:10px;background:#7851d6;color:white;padding:11px 23px;margin-top:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.toolbar input,.toolbar select{background:#181821;color:white;border:1px solid #383343;border-radius:9px;padding:11px 14px;min-width:170px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:25px 0 75px}.card{border:1px solid #302c3c;border-radius:14px;background:#171720;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0}.card:hover{border-color:#7655b3;transform:translateY(-2px)}.cover{height:170px;background:linear-gradient(135deg,#211736,#61448c 55%,#151723);background-position:center;background-size:cover}.card:nth-child(3n+2) .cover{background-color:#202238}.card-body{padding:22px}.card h3{font-size:19px;line-height:1.4;margin:10px 0}.date{font-size:12px;color:#b0a8bd}.card p{font-size:14px;color:#aaa6b8}.page{padding:65px 0}.article{max-width:750px;margin:65px auto}.article h1{font-size:clamp(32px,5vw,52px)}.article .body{white-space:pre-wrap;overflow-wrap:anywhere;color:#d3cedb;line-height:2}.article img{width:100%;border-radius:12px;margin:20px 0}.back{border:0;background:none;color:#b69aff;padding:0}footer{text-align:center;padding:28px;color:#827c90;border-top:1px solid #292733;font-size:13px}.empty{color:#aaa6b8;padding:35px 0}@media(max-width:700px){header{align-items:flex-start;flex-direction:column;gap:15px}nav{gap:22px}.hero{padding:75px 0}.grid{grid-template-columns:1fr}h1{letter-spacing:-.03em}}
</style></head><body><header><a class="logo" href="#home">ORDINARY DAYS<span class="accent">.</span></a><nav><a href="#home">Home</a><a href="#journal">Journal</a><a href="#about">About</a></nav></header><main id="app"><p class="muted">게시글을 불러오는 중...</p></main><footer>© 2026 Ordinary Days. All rights reserved.</footer><script>
'use strict';let posts=[],loadError=false;const app=document.querySelector('#app');const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeImage=s=>{if(typeof s!=='string'||!s.trim())return '';try{const u=new URL(s,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};function card(p){const im=safeImage(p.image);return `<a class="card" href="#post/${encodeURIComponent(p.id)}"><div class="cover" ${im?`style="background-image:url('${escapeHTML(im).replace(/'/g,'%27')}')"`:''}></div><div class="card-body"><span class="date">${escapeHTML(p.date)} · ${escapeHTML(p.category)}</span><h3>${escapeHTML(p.title)}</h3><p>${escapeHTML(p.description||'')}</p></div></a>`}function listing(items){return items.length?`<div class="grid">${items.map(card).join('')}</div>`:'<p class="empty">표시할 글이 없습니다.</p>'}function render(){const [page,arg]=location.hash.slice(1).split('/');if(page==='about'){app.innerHTML=`<div class="article"><div class="eyebrow">ABOUT</div><h1>Ordinary Days.</h1><p class="muted">평범한 일상과 생각, 관심사와 경험을 자유롭게 기록하는 개인 블로그입니다.</p></div>`}else if(page==='journal'){const cats=[...new Set(posts.map(p=>p.category).filter(Boolean))];app.innerHTML=`<div class="page"><div class="eyebrow">THE JOURNAL</div><h1>All Stories.</h1><p class="muted">평범한 날들의 기록</p><div class="toolbar"><input id="search" placeholder="글 검색" aria-label="글 검색"><select id="category" aria-label="카테고리"><option value="">전체 카테고리</option>${cats.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')}</select></div><div id="results"></div></div>`;const update=()=>{const q=document.querySelector('#search').value.trim().toLocaleLowerCase(),c=document.querySelector('#category').value;document.querySelector('#results').innerHTML=listing(posts.filter(p=>(!c||p.category===c)&&(!q||(p.title+' '+(p.description||'')+' '+p.content).toLocaleLowerCase().includes(q))))};document.querySelector('#search').addEventListener('input',update);document.querySelector('#category').addEventListener('change',update);update()}else if(page==='post'){const p=posts.find(x=>String(x.id)===decodeURIComponent(arg||''));if(!p){app.innerHTML='<div class="article"><h1>글을 찾을 수 없습니다.</h1><a class="link" href="#journal">목록으로 돌아가기</a></div>';return}const im=safeImage(p.image);app.innerHTML=`<article class="article"><a class="back" href="#journal">← Journal</a><p class="date">${escapeHTML(p.date)} · ${escapeHTML(p.category)}</p><h1>${escapeHTML(p.title)}</h1>${im?`<img alt="게시글 이미지" src="${escapeHTML(im)}">`:''}<div class="body">${escapeHTML(p.content)}</div></article>`}else{app.innerHTML=`<div class="hero"><div class="eyebrow">A PERSONAL JOURNAL</div><h1>Ordinary Days.<br><span class="accent">Extraordinary Thoughts.</span></h1><p class="muted">평범한 날들 속에서 발견한 생각과 이야기들.</p><a class="btn" href="#journal">Explore Journal →</a></div><section><h2>Latest Writing</h2>${listing(posts.slice(0,6))}</section>`}if(loadError)app.insertAdjacentHTML('afterbegin','<p class="empty">게시글 파일을 불러오지 못했습니다. posts.json을 확인해 주세요.</p>');window.scrollTo(0,0)}async function init(){try{const r=await fetch('./posts.json',{cache:'no-store'});if(!r.ok)throw Error('fetch');const data=await r.json();if(!Array.isArray(data))throw Error('format');posts=data.filter(p=>p&&p.id!=null&&typeof p.title==='string'&&typeof p.content==='string').sort((a,b)=>String(b.date).localeCompare(String(a.date)))}catch(e){loadError=true}render()}window.addEventListener('hashchange',render);init();
</script></body></html>
